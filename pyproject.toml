[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stove_controller"
version = "0.0.2"
description = "Custom Home Assistant integration for stove controller with anti-short-cycle logic"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-randomly>=3.15.0",
    "homeassistant",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest-homeassistant-custom-component>=0.13",
    "pytest-socket>=0.6",
]

[tool.setuptools]
packages = ["stove_controller"]
package-dir = {"stove_controller" = "."}

[tool.setuptools.package-data]
stove_controller = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
